# Regenerate package-lock.json on Linux.
#
# A lockfile resolved on Windows omits transitive dependencies of the wasm
# runtimes - @emnapi/core, @emnapi/runtime, @emnapi/wasi-threads, tslib - which
# hoist to the top level on Linux but sit nested on Windows. `npm ci` then fails
# on an Ubuntu runner with EUSAGE while every local command stays green, because
# `npm install` on Windows happily repairs the tree it just broke.
#
# Run this after any dependency change made from Windows:
#     gh workflow run relock.yml
name: Relock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relock
  cancel-in-progress: false

jobs:
  relock:
    name: Regenerate the lockfile on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Resolve the dependency tree on Linux
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      # The whole point of the job. If `npm ci` cannot consume what was just
      # written, committing it would only move the failure to the next push.
      - name: Prove npm ci can consume it
        run: npm ci

      - name: Commit the lockfile if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile unchanged - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: resolve the lockfile on Linux

          Regenerated by .github/workflows/relock.yml. A tree resolved on
          Windows omits the wasm-runtime transitives that hoist to the top
          level on Linux, so npm ci failed with EUSAGE on every runner."
          git push

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Grouped so the bot produces reviewable batches rather than noise that
    # gets muted (CI-D06).
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['@biomejs/*', 'stylelint*', 'eslint*', 'vitest', '@vitest/*', 'typescript']
    ignore:
      # typescript-eslint refuses to load against TS 7.0 and throws at require
      # time, so eslint exits 2 and the whole gate dies before it lints a file.
      # The project is on TS 5.x by the framework scaffold's choice; TS 6 is the
      # documented side-by-side path and TS >=7.1 support is tracked upstream at
      # typescript-eslint#10940. Bumping to 7.x breaks CI 100% of the time, so
      # the bot should stop proposing it until that issue closes.
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
